name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: raundo
          POSTGRES_PASSWORD: raundo_local_only
          POSTGRES_DB: raundo_local_suite
        ports:
          - 55432:5432
        options: --health-cmd "pg_isready -U raundo" --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://raundo:raundo_local_only@127.0.0.1:55432/raundo_local_suite
      RAUNDO_POSTGRES_SUITE_TESTS: '1'
      # Shared limiter: proves two workers see the same login/MFA counters.
      REDIS_URL: redis://127.0.0.1:56379/0
      RATE_LIMIT_BACKEND: redis
      RAUNDO_REDIS_SUITE_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: ruff check .
      - run: alembic upgrade 20261027_0007
      - run: pytest -q tests/test_premium_migration.py::test_premium_migration_grandfather_backfill_on_postgres
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
  admin:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: raundo
          POSTGRES_PASSWORD: raundo_local_only
          POSTGRES_DB: raundo_admin_dev
        ports:
          - 55432:5432
        options: --health-cmd "pg_isready -U raundo" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://raundo:raundo_local_only@127.0.0.1:55432/raundo_admin_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: alembic upgrade head
      - run: npm ci
        working-directory: admin-web
      - run: npm run build
        working-directory: admin-web
      - run: npm run lint
        working-directory: admin-web
      - run: npx playwright install --with-deps chromium
        working-directory: admin-web
      - run: npm run e2e
        working-directory: admin-web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: admin-web/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-interface-gallery
          path: admin-web/screenshots/public-*.png
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_public_source.py
