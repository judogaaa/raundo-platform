[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raundo"
version = "0.1.0"
description = "RAUNDO full-scope Telegram bot platform: startups, investors and community"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "pydantic-settings>=2.8,<3",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "redis>=5,<7",
  "Pillow>=10.4,<12",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "argon2-cffi>=23.1,<26",
  "pyotp>=2.9,<3",
  "httpx>=0.27,<1",
  "aiohttp-socks>=0.9,<1",
]

# Pillow is used only for display-time 16:9 letterbox of square covers.
# Original telegram_file_id rows are never overwritten.

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.11,<1",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "aiohttp-socks>=0.9,<1",
]

[project.scripts]
raundo-bot = "raundo.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
